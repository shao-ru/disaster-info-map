<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>避難所マップ（試作版）</title>
  <!-- 地図ライブラリ MapLibre GL JS（バージョンを固定） -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <!-- 地図の計算ライブラリ Turf.js（範囲の拡大・円・点が中にあるかの判定） -->
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>避難所マップ</h1>
    <span class="tag">試作版</span>
  </header>

  <div id="offline" class="banner banner-warn" hidden>オフラインです。この試作版はまだオフラインに対応していないため、背景地図が表示されないことがあります。</div>
  <div id="status" class="banner" hidden></div>

  <main class="layout">
    <div id="map" aria-label="避難所の地図"></div>

    <section class="panel" aria-label="避難所の検索">
      <div class="picker">
        <div class="row">
          <label>県 <select id="pref"></select></label>
          <label>市区町村 <select id="city"></select></label>
        </div>
        <div class="row">
          <select id="city-buffer" aria-label="周辺の距離"></select>
          <button id="city-btn" type="button" class="primary">表示</button>
        </div>
        <div class="row">
          <span class="muted">現在地から：</span>
          <select id="gps-radius" aria-label="半径"></select>
          <button id="near-btn" type="button" disabled title="先に地図右上の ◎ で現在地を取得してください">探す</button>
        </div>
      </div>

      <div class="panel-head">
        <h2 id="result-title">避難所</h2>
        <span id="count" class="muted"></span>
      </div>
      <p id="origin-label" class="muted sub"></p>
      <div id="filters" class="filters" role="group" aria-label="絞り込み"></div>
      <div id="list"></div>

      <div class="legend">
        <span><i class="dot dot-flood"></i>洪水に対応</span>
        <span><i class="dot dot-other"></i>その他</span>
        <span><i class="dot dot-other ring"></i>太い白縁＝指定避難所</span>
        <span><i class="swatch swatch-area"></i>検索した範囲</span>
        <span><i class="swatch swatch-boundary"></i>市区町村の範囲</span>
        <a href="test.html" target="_blank">課題チェック</a>
      </div>

      <p id="approx-note" class="notice" hidden>※ 市区町村の範囲は、行政区域データの代わりに避難所の位置から推定した暫定のものです。</p>
      <p class="notice">
        距離は直線距離です。実際の避難は、市の避難情報と現地の状況に従ってください。<br>
        出典：国土地理院「指定緊急避難場所・指定避難所データ」、地理院タイル
      </p>
      <div class="panel-foot">
        <button id="contributors-btn" type="button">参加者</button>
      </div>
    </section>
  </main>

  <!-- 「参加者」ボタンで開く（中身は CONTRIBUTORS.md） -->
  <dialog id="contributors-dialog" class="dialog" aria-labelledby="contributors-title">
    <div class="dialog-head">
      <h2 id="contributors-title">参加者（Contributors）</h2>
      <button type="button" class="dialog-close" aria-label="閉じる">✕</button>
    </div>
    <div class="dialog-body"></div>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>
</html>
